[project]
name = "research-idea-explorer"
version = "0.1.0"
description = "Research Idea Explorer: a lead splits a rough research idea into angles, parallel researchers search papers (OpenAlex, Semantic Scholar, PubMed, arXiv) and follow citations, and a writer reports the closest existing work, the gaps, and who to talk to"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
